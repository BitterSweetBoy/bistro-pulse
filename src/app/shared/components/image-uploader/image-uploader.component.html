<div class="flex items-start gap-6">

  <!-- COVER MODE -->
  <ng-container *ngIf="!multiple">
    <label for="coverInput"
      class="group relative rounded-lg w-80 h-52 flex items-center justify-center cursor-pointer transition-colors hover:bg-primary/10"
      [ngClass]="coverImage() ? 'border-none' : 'border-2 border-dashed border-primary text-primary'">
      <ng-container *ngIf="!coverImage(); else showCover">
        {{ placeHolderCover }}
      </ng-container>
      <ng-template #showCover>
        <img [src]="coverImage()!" class="object-cover w-full h-full rounded-lg" alt="Portada"/>
      </ng-template>
      <input id="coverInput" type="file" accept="image/*" hidden (change)="onCoverSelected($event)" />
    </label>
  </ng-container>

  <!-- GALLERY MODE -->
  <ng-container *ngIf="multiple">
    <div [ngClass]="{
      'grid auto-rows-auto grid-flow-row-dense gap-4': layout === 'default',
      'flex flex-row gap-2 overflow-x-auto': layout === 'row'
    }"
    [ngStyle]="layout === 'default'
      ? { 'grid-template-columns': 'repeat(' + itemsPerRow + ', minmax(0, 1fr))' }
      : {}">
      <!-- Previews -->
      <div *ngFor="let src of secondaryImages(); let i = index"
           class="relative rounded-lg w-40 h-28 shrink-0 overflow-visible">
        <label for="replace-sec-{{i}}" class="block w-full h-full cursor-pointer">
          <img [src]="src" class="object-cover w-full h-full rounded-lg" alt="Imagen {{i+1}}" />
        </label>
        <button (click)="removeSecondary(i)"
                class="absolute -top-2 -right-2 bg-red-500 rounded-full p-1 text-white">
          <svg class="h-4 w-4 text-white transition-colors"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 12h12"></path>
          </svg>
        </button>
        <input id="replace-sec-{{i}}" type="file" accept="image/*" hidden (change)="onSecondaryReplace($event, i)" />
      </div>
      <!-- Add Button -->
      <ng-container *ngIf="secondaryImages().length < maxImages">
        <label for="secInput"
               class="border-2 border-dashed border-neutral-300 rounded-lg w-40 h-28 flex items-center justify-center text-3xl text-neutral-500 cursor-pointer hover:bg-neutral-100 shrink-0">
          {{ placeHolderText }}
        </label>
        <input id="secInput" type="file" accept="image/*" hidden (change)="onSecondarySelected($event)" />
      </ng-container>
    </div>
  </ng-container>
