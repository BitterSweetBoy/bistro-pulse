<div class="w-full space-y-4" [formGroup]="locationFormGroup">
  <div class="relative w-full">
    <label class="block text-sm font-medium text-gray-700 mb-2">
      Ubicación del restaurante
    </label>
    <p-autoComplete
      formControlName="address"
      markAsDirtyOnBlur
      [suggestions]="suggestions()"
      (completeMethod)="searchByText($event)"
      (onSelect)="onSelect($event.value)"
      field="displayName"
      [minLength]="1"
      placeholder="Buscar dirección..."
      styleClass="w-full"
      inputStyleClass="w-full">
    </p-autoComplete>    
  </div>

  <div class="relative h-80 w-full rounded-lg overflow-hidden border border-gray-300">
    <google-map
      mapId="mymap"
      height="100%"
      width="100%"
      [center]="markerPosition()"
      [zoom]="zoom"
      [options]="mapOptions">
        <map-advanced-marker
          [position]="markerPosition()"
          [options]="advancedMarkerOptions"
          (mapDragend)="onMarkerDragEnd($event)">
        </map-advanced-marker>
    </google-map>   
  </div>
</div>
