<div class="flex items-center">
  <ng-container *ngFor="let step of steps; let i = index">
    <!-- contenedor de círculo + etiqueta abajo -->
    <div class="flex flex-col items-center p-4">
      <!-- círculo -->
      <div class="w-7 h-7 flex items-center justify-center rounded-full"
          [class.bg-primary]="step.isCompleted || currentIndex === i" 
          [class.bg-red-600]="!step.isCompleted && step.hasError"
          [class.bg-neutral-300]="!step.isCompleted && !step.hasError && currentIndex !== i"
          [class.text-white]="step.isCompleted || currentIndex === i || (!step.isCompleted && step.hasError)"
          [class.text-neutral-600]="!step.isCompleted && !step.hasError && currentIndex !== i">
        <ng-container *ngIf="step.isCompleted; else notCompleted">
          <!-- check -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="color: white;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </ng-container>
        <ng-template #notCompleted>
          <ng-container *ngIf="step.hasError; else showIndex">
            <!-- cruz -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </ng-container>
        </ng-template>
        <ng-template #showIndex>{{ i + 1 }}</ng-template>
      </div>
      <!-- etiqueta abajo del círculo -->
      <div class="mt-3 text-sm text-neutral-700 text-center" [ngClass]="{ 'font-medium' : currentIndex === i}">
        {{ step.label }}
      </div>
    </div>

    <!-- línea de conexión -->
    <div
      *ngIf="i < steps.length - 1"
      class="flex-1 h-[4px]"
      [ngClass]="{ 'bg-primary': i < currentIndex, 'bg-neutral-300': i >= currentIndex }"
    ></div>
  </ng-container>
</div>

<!-- contenido del paso actual -->
<div class="mt-3 p-4">
  <ng-content></ng-content>
</div>

<!-- botones Back / Next -->
<div class="flex justify-between mt-4">
  <button (click)="prev.emit()" [disabled]="currentIndex === 0" class="px-4 py-2 border rounded hover:bg-neutral-100 disabled:opacity-50">
    &lt; Anterior
  </button>
  <button (click)="next.emit()" [disabled]="currentIndex === steps.length - 1" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-700 disabled:opacity-50 transition" >
    Siguiente &gt;
  </button>
</div>
