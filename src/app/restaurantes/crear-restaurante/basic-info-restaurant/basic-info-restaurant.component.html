<div [formGroup]="infoGroup" class="space-y-4 mb-10 w-full">
  <span class="text-lg font-semibold text-neutral-900">Datos del Restaurante</span>

  <div class="flex space-x-4 mt-6">
    <div class="flex-1">
      <label class="block text-neutral-800">Nombre del restaurante</label>
      <input
        pInputText
        formControlName="restaurantName"
        placeholder="Sun valley restaurant"
        appMarkAsDirtyOnBlur
        class="w-full"
      />
    </div>
    <div class="flex-1">
      <label class="block text-neutral-800">Número Telefónico</label>
      <input
        pInputText
        pKeyFilter="num"
        formControlName="phoneNumber"
        placeholder="95032543"
        appMarkAsDirtyOnBlur
        class="w-full"
      />
    </div>
  </div>

  <div>
    <app-location-picker 
      [locationFormGroup]="locationFormGroup">
    </app-location-picker>
  </div>

  <div class="flex space-x-4">
    <div class="flex-1">
      <label class="block text-neutral-800">Correo electrónico</label>
      <input
        type="email"
        pInputText
        formControlName="email"
        placeholder="info@restaurante.com"
        appMarkAsDirtyOnBlur
        class="w-full"
      />
    </div>
    <div class="flex-1">
      <label class="block text-neutral-800">Tipo de Cocina</label>
      <p-select
        [options]="cuisineTypes"
        formControlName="cocina"
        optionLabel="label"
        optionValue="value"
        placeholder="Seleccionar"
        class="w-full"
      ></p-select>
    </div>
  </div>

  <div>
    <label class="block text-neutral-800">Descripción</label>
    <textarea
      pTextarea
      formControlName="descripcion"
      rows="4"
      placeholder="Describe tu restaurante..."
      appMarkAsDirtyOnBlur
      class="w-full"
    ></textarea>
  </div>

  <app-social-media-profiles 
    [socialGroup]="socialGroup">
  </app-social-media-profiles>
  <app-image-restaurant-uploader 
    [imagesGroup]="imagesGroup" 
    [maxItems]="maxImages">
  </app-image-restaurant-uploader>

</div>
